name: CI Pipeline

on:
  push:
    branches: [ main, "jules-*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (xa65, VICE, Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xa65 \
            vice \
            xvfb \
            make \
            zip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]

      - name: Compile C64 Assembly Projects
        run: |
          make invaders
          make template

      - name: Run Test Suite
        run: |
          PYTHONPATH=. xvfb-run python -m pytest -v

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: c64-binaries
          path: |
            games/invaders/*.prg
            games/invaders/*.d64
            games/invaders/*.crt
            games/template/*.prg
            games/template/*.d64
            games/template/*.crt
